[project]
name = "event-hub"
version = "0.1.0"
description = "Event ingestion service with webhooks and workers"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "motor==3.7.1",
    "redis==8.1.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "testcontainers==4.15.0",
]
